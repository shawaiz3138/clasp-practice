name: Deploy Apps Script

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: |
          cat << 'EOF' > ~/.clasprc.json
          ${{ secrets.CLASPRC_JSON }}
          EOF

      - name: Debug - check credentials file (remove after fixing)
        run: |
          echo "File size:"
          wc -c ~/.clasprc.json
          echo "First 20 chars:"
          head -c 20 ~/.clasprc.json
          echo ""
          echo "Valid JSON check:"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json', 'utf8')); console.log('VALID JSON')" || echo "INVALID JSON"

      - name: Create .clasp.json
        run: |
          echo '{"scriptId":"${{ secrets.SCRIPT_ID }}","rootDir":"./src"}' > .clasp.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy (prod only)
        if: github.ref == 'refs/heads/main'
        run: clasp deploy --description "prod-${{ github.sha }}"

      - name: Deploy (dev only)
        if: github.ref == 'refs/heads/dev'
        run: clasp deploy --description "dev-${{ github.sha }}"